<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GridWatch: Ontario Electricity Demand</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #1f2933; }
    h1 { margin-bottom: 0.2rem; }
    .sub { color: #616e7c; margin-top: 0; }
    .cards { display: flex; gap: 1rem; margin: 1.5rem 0; }
    .card { flex: 1; padding: 1rem; border: 1px solid #e4e7eb; border-radius: 8px; }
    .card b { display: block; font-size: 1.6rem; margin-top: 0.3rem; }
    .error { color: #b42318; }
  </style>
</head>
<body>
  <h1>GridWatch</h1>
  <p class="sub">Ontario electricity demand from IESO public data, and the hours to avoid.</p>

  <div class="cards">
    <div class="card">Latest demand<b id="latest">…</b></div>
    <div class="card">Expected peak hours<b id="peaks">…</b></div>
  </div>

  <canvas id="profile" height="110"></canvas>
  <p class="sub">Average demand by hour over the last 7 days. Red bars are the forecast peak hours:
     shift laundry, dishwashers and EV charging away from them.</p>
  <p id="error" class="error"></p>

  <script>
    const API = location.origin.startsWith("http") ? "" : "http://127.0.0.1:8000";
    const hourLabel = h => `${String(h - 1).padStart(2, "0")}:00`;

    async function load() {
      try {
        const [demand, forecast] = await Promise.all([
          fetch(`${API}/api/demand?days=1`).then(r => r.json()),
          fetch(`${API}/api/forecast?days=7&top=3`).then(r => r.json()),
        ]);
        const last = demand[demand.length - 1];
        document.getElementById("latest").textContent =
          `${last.ontario_mw.toLocaleString()} MW (${last.date} ${hourLabel(last.hour)})`;
        document.getElementById("peaks").textContent = forecast.peak_hours.map(hourLabel).join(", ");

        const hours = Object.keys(forecast.profile).map(Number);
        new Chart(document.getElementById("profile"), {
          type: "bar",
          data: {
            labels: hours.map(hourLabel),
            datasets: [{
              label: "Average Ontario demand (MW)",
              data: hours.map(h => forecast.profile[h]),
              backgroundColor: hours.map(h => forecast.peak_hours.includes(h) ? "#d64545" : "#3e7bfa"),
            }],
          },
          options: { plugins: { legend: { display: false } }, scales: { y: { title: { display: true, text: "MW" } } } },
        });
      } catch (err) {
        document.getElementById("error").textContent = "Could not load data: " + err;
      }
    }
    load();
    setInterval(() => location.reload(), 15 * 60 * 1000);
  </script>
</body>
</html>
